name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import json;print(json.load(open('extension/manifest.json',encoding='utf-8'))['version'])")
          echo "Версия расширения: $V" > "extension/version-$V.txt"
          python -c "import shutil; shutil.make_archive('TG-Hub-Extension','zip','extension')"
          gh release create "v${{ github.run_number }}" dist/TG-Hub-Shell.exe TG-Hub-Extension.zip \
            --latest --title "Расширение $V · программа #${{ github.run_number }}" \
            --notes "Расширение для браузера: версия $V (TG-Hub-Extension.zip). TG-Hub-Shell.exe — программа для Windows, установка не нужна."
