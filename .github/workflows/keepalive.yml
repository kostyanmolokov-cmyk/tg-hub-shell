name: Keep API awake
# Бесплатный сервер Render засыпает через 15 минут без запросов. Этот запрос раз в ~10 минут не даёт ему уснуть.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" --max-time 90 --retry 2 --retry-delay 5 https://tg-hub-api-0mmr.onrender.com/ || echo "сервер не ответил (проснётся при следующем запросе)"
